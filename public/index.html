<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Tramvaje</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tramvaje">
  <meta name="theme-color" content="#F2EBD9">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap">

  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="app">
    <header>
      <div class="title">Další tramvaje</div>
      <time class="clock" id="clock">--:--</time>
    </header>

    <section class="alert" id="alert" hidden>
      <svg class="alert-icon" viewBox="0 0 24 26" preserveAspectRatio="xMinYMid meet" aria-hidden="true">
        <path d="M2 4 L5 26 L19 26 L22 4 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <line x1="0" y1="4" x2="24" y2="4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M8 0 L16 0 L17 4 L7 4 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <line x1="9" y1="10" x2="9" y2="20" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="12" y1="10" x2="12" y2="20" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="15" y1="10" x2="15" y2="20" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span class="alert-text">Vyndat popelnici</span>
    </section>

    <section class="stops" id="stops" aria-live="polite"></section>

    <section class="weather" id="weather" hidden>
      <svg class="wx-icon" viewBox="0 0 40 40" aria-hidden="true"></svg>
      <div class="weather-content">
        <div class="weather-row weather-current">
          <span class="wx-temp">—</span>
          <span class="wx-desc"></span>
          <span class="wx-sep" aria-hidden="true">·</span>
          <span class="wx-aqi">
            <span class="dot wx-aqi-dot" hidden></span>
            <span class="wx-aqi-text"></span>
          </span>
        </div>
        <div class="weather-row weather-forecast" hidden>
          <span class="wx-fcast"></span>
        </div>
      </div>
    </section>

    <nav class="view-switcher" id="view-switcher" aria-label="Výběr cesty"></nav>

    <footer>
      <span id="updated">načítám…</span>
      <span class="updated-source" id="updated-source"></span>
    </footer>
  </main>

  <template id="stop-template-primary">
    <article class="stop stop-primary" data-priority="primary">
      <svg class="icon" viewBox="0 0 22 29" preserveAspectRatio="xMinYMid meet" aria-hidden="true">
        <rect x="0" y="0" width="22" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <line x1="2" y1="8" x2="20" y2="8" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="5" cy="16" r="1.6" fill="currentColor"/>
        <circle cx="17" cy="16" r="1.6" fill="currentColor"/>
        <line x1="4" y1="26" x2="2" y2="29" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="18" y1="26" x2="20" y2="29" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <div class="stop-body">
        <div class="stop-label"></div>
        <div class="stop-times">
          <span class="dot" hidden></span>
          <span class="next-num">—</span>
          <span class="next-unit">min</span>
          <span class="next-time"></span>
          <span class="then">&nbsp;</span>
        </div>
      </div>
    </article>
  </template>

  <template id="stop-template-secondary">
    <article class="stop stop-secondary" data-priority="secondary">
      <svg class="icon" viewBox="0 0 22 29" preserveAspectRatio="xMinYMid meet" aria-hidden="true">
        <rect x="0" y="0" width="22" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <line x1="2" y1="8" x2="20" y2="8" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="5" cy="16" r="1.6" fill="currentColor"/>
        <circle cx="17" cy="16" r="1.6" fill="currentColor"/>
        <line x1="4" y1="26" x2="2" y2="29" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="18" y1="26" x2="20" y2="29" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <div class="stop-content">
        <div class="stop-label"></div>
        <div class="stop-times">
          <span class="dot" hidden></span>
          <span class="next-num">—</span>
          <span class="next-unit">min</span>
          <span class="next-time"></span>
        </div>
        <div class="then">&nbsp;</div>
      </div>
    </article>
  </template>

  <script src="/app.js"></script>
</body>
</html>
